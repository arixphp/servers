server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;
    autoindex off;

    location ~* (^|/)\. { return 403; }
    location ~* ^/(app|core|cli|tests|docs|storage|assets)(/|$) { return 403; }

    location ~* ^/(styles/(?:[a-z0-9_-]+/)*[a-z0-9_-]+\.css|scripts/(?:[a-z0-9_-]+/)*[a-z0-9_-]+\.js|fonts/(?:[a-z0-9_-]+/)*[a-z0-9_-]+\.(?:woff2?|ttf|otf)|media/(?:[a-z0-9_-]+/)*[a-z0-9_-]+\.(?:avif|gif|ico|jpe?g|png|webp|mp4|webm|ogv)|favicon\.ico|robots\.txt)$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location ~* ^/(styles|scripts|fonts|media)(/|$) { return 403; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ~ \. { return 403; }
    location / { try_files $uri /index.php?$query_string; }
}
