name: Deployment Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      app_ref:
        description: Application branch or tag
        default: bugfix/experiment-litespeed-assets
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: apache
            port: 80
          - server: nginx
            port: 80
          - server: openlitespeed
            port: 8088
          - server: litespeed
            port: 80
          - server: frankenphp
            port: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test suite scripts
        run: python3 -m unittest discover -s tests -v
      - name: Create application
        env:
          APP_REF: ${{ inputs.app_ref || 'bugfix/experiment-litespeed-assets' }}
        run: bash scripts/prepare-app.sh
      - name: Build server image
        run: docker build -f "docker/${{ matrix.server }}/Dockerfile" -t "arix-security:${{ matrix.server }}" .
      - name: Start server
        run: docker run -d --name arix-test -p "127.0.0.1:8080:${{ matrix.port }}" "arix-security:${{ matrix.server }}"
      - name: Wait for server
        id: ready
        run: bash scripts/wait-http.sh http://127.0.0.1:8080/
      - name: Check public access
        run: bash scripts/run-security-tests.sh public
      - name: Check private access
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash scripts/run-security-tests.sh private
      - name: Logs on failure
        if: failure()
        run: docker logs arix-test || true
