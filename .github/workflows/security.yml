name: Deployment Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: apache
            port: 80
          - server: nginx
            port: 80
          - server: openlitespeed
            port: 8088
          - server: litespeed
            port: 80
          - server: frankenphp
            port: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test suite scripts
        run: python3 -m unittest discover -s tests -v
      - name: Install Arix CLI 0.4.5
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/arix.tar.gz" \
            https://github.com/arixphp/cli/releases/download/0.4.5/arix-0.4.5-linux-x64.tar.gz
          echo '95fdc9e5089abbb47be1eea4db58103100286c890d4d03e936b86c16ede5d69e  '"$RUNNER_TEMP/arix.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/arix-cli"
          tar -xzf "$RUNNER_TEMP/arix.tar.gz" -C "$RUNNER_TEMP/arix-cli"
          echo "$RUNNER_TEMP/arix-cli" >> "$GITHUB_PATH"
      - name: Create application
        run: bash scripts/prepare-app.sh
      - name: Build server image
        run: docker build -f "docker/${{ matrix.server }}/Dockerfile" -t "arix-security:${{ matrix.server }}" .
      - name: Start server
        run: docker run -d --name arix-test -p "127.0.0.1:8080:${{ matrix.port }}" "arix-security:${{ matrix.server }}"
      - name: Wait for server
        id: ready
        run: bash scripts/wait-http.sh http://127.0.0.1:8080/
      - name: Check public access
        run: bash scripts/run-security-tests.sh public
      - name: Check private access
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: bash scripts/run-security-tests.sh private
      - name: Compare historical LiteSpeed policies
        if: ${{ !cancelled() && matrix.server == 'litespeed' && steps.ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          before=cdf7c2b8c62ed9ad047c931bb49aa450e1c0439f
          after=87835d264757815fa1f279a07a51a124c6293b40
          for scenario in before root-only without-rewrite-off without-uri-if without-method-if directories-only after; do
            echo "::group::Policy $scenario"
            for file in .htaccess styles/.htaccess scripts/.htaccess fonts/.htaccess media/.htaccess; do
              revision="$before"
              if [[ "$scenario" == after ]] \
                || [[ "$scenario" == root-only && "$file" == .htaccess ]] \
                || [[ "$scenario" == directories-only && "$file" != .htaccess ]]; then
                revision="$after"
              fi
              curl --fail --location --silent --show-error --retry 3 \
                "https://raw.githubusercontent.com/barbosa89/hellen-suite-web/$revision/$file" \
                -o "$RUNNER_TEMP/arix-policy-htaccess"
              if [[ "$file" != .htaccess ]]; then
                case "$scenario" in
                  without-rewrite-off)
                    sed -i '/^RewriteEngine Off$/d' "$RUNNER_TEMP/arix-policy-htaccess"
                    ;;
                  without-uri-if)
                    sed -i '/^<If "%{REQUEST_URI}/,/^<\/If>/d' "$RUNNER_TEMP/arix-policy-htaccess"
                    ;;
                  without-method-if)
                    sed -i '/^<If "%{REQUEST_METHOD}/,/^<\/If>/d' "$RUNNER_TEMP/arix-policy-htaccess"
                    ;;
                esac
              fi
              docker cp "$RUNNER_TEMP/arix-policy-htaccess" "arix-test:/var/www/vhosts/localhost/html/$file"
            done
            docker restart arix-test
            bash scripts/wait-http.sh http://127.0.0.1:8080/
            for scope in public private; do
              if bash scripts/run-security-tests.sh "$scope"; then
                echo "RESULT $scenario $scope: PASS"
              else
                echo "RESULT $scenario $scope: FAIL"
              fi
            done
            echo 'Response headers for POST requests to existing assets:'
            for path in /styles/app.css /scripts/app.js /media/security-probe.png /fonts/source-sans-3-roman-latin.woff2; do
              echo "POST $path"
              curl --path-as-is --silent --show-error --max-time 10 --request POST --output /dev/null \
                --dump-header - "http://127.0.0.1:8080$path"
            done
            echo 'Response headers for GET /core:'
            curl --path-as-is --silent --show-error --max-time 10 --output /dev/null \
              --dump-header - http://127.0.0.1:8080/core
            echo '::endgroup::'
          done
      - name: Logs on failure
        if: failure()
        run: docker logs arix-test || true
